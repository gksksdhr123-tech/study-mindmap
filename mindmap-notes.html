<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>요점정리 마인드맵</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a1626">
<link rel="apple-touch-icon" href="icon.svg">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  :root{
    --bg: #0a1626;
    --bg-grid: #12203a;
    --panel: #0f1e33;
    --panel-border: #1f3352;
    --cyan: #6fd6ff;
    --steel: #ff9552;
    --text: #dce7f2;
    --text-dim: #7c93ab;
    --mono: 'IBM Plex Mono', 'Menlo', monospace;
    --sans: 'Pretendard', -apple-system, 'Noto Sans KR', sans-serif;
  }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html, body { width:100%; height:100%; overflow:hidden; background:var(--bg); font-family:var(--sans); touch-action:none; }
  #canvas-wrap { position:fixed; inset:0; }
  canvas { display:block; touch-action:none; }

  #bg-grid {
    position:fixed; inset:0; pointer-events:none; opacity:0.35;
    background-image:
      linear-gradient(var(--bg-grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--bg-grid) 1px, transparent 1px);
    background-size: 42px 42px;
    mask-image: radial-gradient(ellipse at center, black 0%, transparent 75%);
  }

  #header {
    position:fixed; top:0; left:0; right:0; padding:16px 18px 8px;
    pointer-events:none; z-index:5;
  }
  #header .title { font-family:var(--mono); font-size:13px; letter-spacing:0.12em; color:var(--cyan); text-transform:uppercase; }
  #header .sub { font-family:var(--mono); font-size:10px; color:var(--text-dim); margin-top:3px; }
  #header .sub2 { font-family:var(--mono); font-size:9px; color:var(--text-dim); margin-top:2px; opacity:0.75; }

  #emptyHint {
    position:fixed; inset:0; display:none; align-items:center; justify-content:center;
    flex-direction:column; gap:10px; pointer-events:none; z-index:4;
    color:var(--text-dim); font-family:var(--mono); font-size:12px; text-align:center;
  }

  #viewpointBar {
    position:fixed; top:58px; left:14px; right:14px; z-index:5;
    display:none; gap:6px; overflow-x:auto; pointer-events:auto; padding-bottom:4px;
  }
  #viewpointBar::-webkit-scrollbar { display:none; }
  .vp-chip {
    flex:0 0 auto; background:var(--panel); border:1px solid var(--panel-border); color:var(--text-dim);
    font-family:var(--mono); font-size:10.5px; padding:6px 12px; border-radius:14px; cursor:pointer; white-space:nowrap;
  }
  .vp-chip.all { color:var(--cyan); border-color:var(--cyan); }

  #legend {
    position:fixed; bottom:14px; left:14px; z-index:5;
    background:var(--panel); border:1px solid var(--panel-border);
    border-radius:10px; padding:10px 12px; font-family:var(--mono); font-size:10.5px;
    display:none; flex-direction:column; gap:6px; backdrop-filter: blur(6px);
    max-width:150px;
  }
  #legend .item { display:flex; align-items:center; gap:7px; color:var(--text-dim); }
  #legend .dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }

  #addBtn {
    position:fixed; right:18px; bottom:18px; z-index:8;
    width:54px; height:54px; border-radius:50%;
    background:var(--steel); border:none; color:#0a1626; font-size:26px; font-weight:700;
    box-shadow:0 4px 14px rgba(0,0,0,0.4); cursor:pointer;
  }

  #linkModeBanner {
    position:fixed; top:14px; left:50%; transform:translateX(-50%); z-index:12;
    display:none; align-items:center; gap:10px;
    background:var(--steel); color:#0a1626; padding:8px 14px; border-radius:20px;
    font-family:var(--mono); font-size:11.5px; font-weight:600; white-space:nowrap;
  }
  #linkModeBanner button {
    background:rgba(10,22,38,0.25); border:none; color:#0a1626; padding:4px 10px;
    border-radius:12px; font-family:var(--mono); font-size:10.5px; cursor:pointer;
  }

  #info-panel {
    position:fixed; top:14px; right:14px; z-index:6;
    width:min(280px, 82vw); max-height:78vh; overflow-y:auto;
    background:var(--panel); border:1px solid var(--panel-border);
    border-radius:10px; padding:14px; backdrop-filter: blur(6px);
    opacity:0; transform:translateY(-6px); transition:opacity .18s ease, transform .18s ease;
    pointer-events:none;
  }
  #info-panel.show { opacity:1; transform:translateY(0); pointer-events:auto; }
  #info-panel .cat {
    display:inline-block; font-family:var(--mono); font-size:10.5px; font-weight:700;
    letter-spacing:.06em; text-transform:uppercase; padding:4px 10px; border-radius:12px; margin-bottom:10px;
  }
  #info-panel input, #info-panel textarea, #info-panel select {
    width:100%; background:#0a1626; border:1px solid var(--panel-border); color:var(--text);
    border-radius:6px; padding:8px; font-family:var(--sans); font-size:13px; margin-bottom:8px; resize:vertical;
  }
  #info-panel textarea { min-height:90px; line-height:1.5; }
  #info-panel .stat-row { display:flex; justify-content:space-between; font-family:var(--mono); font-size:10.5px; color:var(--text-dim); padding:2px 0 8px; }
  #info-panel .stat-row b { color:var(--cyan); }
  #info-panel .btn-row { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
  #info-panel button {
    padding:8px 6px; border-radius:6px; border:1px solid var(--panel-border);
    font-family:var(--mono); font-size:11px; cursor:pointer; background:#0a1626; color:var(--text-dim);
  }
  #info-panel button.primary { background:var(--cyan); color:#0a1626; border-color:var(--cyan); font-weight:600; }
  #info-panel button.danger { color:#ff6b6b; }
  #ip-addimage { width:100%; margin-bottom:8px; }
  #ip-images { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; }
  #ip-images .thumb { position:relative; width:52px; height:52px; border-radius:6px; overflow:hidden; border:1px solid var(--panel-border); cursor:pointer; }
  #ip-images .thumb img { width:100%; height:100%; object-fit:cover; display:block; }
  #ip-images .thumb.pdf-thumb {
    display:flex; align-items:center; justify-content:center; background:#1a2c47;
    color:var(--steel); font-family:var(--mono); font-size:9px; font-weight:700;
  }
  #ip-images .thumb .del {
    position:absolute; top:0; right:0; background:rgba(0,0,0,0.65); color:#fff;
    width:16px; height:16px; font-size:10px; line-height:16px; text-align:center; cursor:pointer; z-index:1;
  }

  #fileViewer {
    position:fixed; z-index:30; display:none; flex-direction:column;
    background:var(--panel); border:1px solid var(--panel-border); border-radius:10px;
    box-shadow:0 10px 40px rgba(0,0,0,0.6); overflow:hidden;
  }
  #fv-header {
    display:flex; align-items:center; gap:8px; padding:10px 12px; background:#0a1626;
    border-bottom:1px solid var(--panel-border); cursor:grab; user-select:none; touch-action:none;
  }
  #fv-header:active { cursor:grabbing; }
  #fv-title { flex:1; font-family:var(--mono); font-size:11.5px; color:var(--text-dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #fv-nav { display:flex; align-items:center; gap:6px; font-family:var(--mono); font-size:11px; color:var(--text-dim); }
  #fv-nav button, #fv-close {
    background:none; border:1px solid var(--panel-border); color:var(--text); width:26px; height:26px;
    border-radius:6px; cursor:pointer; font-size:13px; line-height:1;
  }
  #fv-close { color:#ff6b6b; }
  #fv-body { flex:1; overflow:auto; display:flex; align-items:center; justify-content:center; background:#000; }
  #fv-body img { max-width:100%; max-height:100%; object-fit:contain; }
  #fv-body embed { width:100%; height:100%; border:none; }

  #modal-overlay {
    position:fixed; inset:0; z-index:20; display:none;
    background:rgba(5,10,18,0.75); align-items:center; justify-content:center;
  }
  #modal {
    width:min(340px, 88vw); background:var(--panel); border:1px solid var(--panel-border);
    border-radius:12px; padding:18px;
  }
  #modal h3 { font-family:var(--mono); font-size:13px; color:var(--cyan); margin-bottom:12px; letter-spacing:.04em; }
  #modal label { display:block; font-family:var(--mono); font-size:10px; color:var(--text-dim); margin-bottom:4px; }
  #modal input, #modal textarea {
    width:100%; background:#0a1626; border:1px solid var(--panel-border); color:var(--text);
    border-radius:6px; padding:9px; font-family:var(--sans); font-size:13px; margin-bottom:12px; resize:vertical;
  }
  #modal textarea { min-height:80px; }
  .parent-badge {
    font-family:var(--mono); font-size:11px; color:var(--text-dim); margin-bottom:14px;
    padding:8px 10px; border-radius:6px; background:#0a1626; border-left:3px solid var(--panel-border);
  }
  .parent-badge.has-parent { color:var(--text); }
  #modal .checkbox-row { display:flex; align-items:center; gap:6px; margin-bottom:14px; font-family:var(--mono); font-size:10.5px; color:var(--text-dim); }
  #modal .checkbox-row input { width:auto; margin:0; }
  #modal .btn-row { display:flex; gap:8px; }
  #modal button { flex:1; padding:10px; border-radius:8px; border:1px solid var(--panel-border); background:#0a1626; color:var(--text-dim); font-family:var(--mono); font-size:12px; cursor:pointer; }
  #modal button.primary { background:var(--steel); color:#0a1626; border-color:var(--steel); font-weight:600; }
</style>
</head>
<body>

<div id="bg-grid"></div>
<div id="canvas-wrap"></div>

<div id="header">
  <div class="title">요점정리 마인드맵</div>
  <div class="sub">NODES: <span id="node-count">0</span> / LINKS: <span id="link-count">0</span></div>
  <div class="sub2">드래그: 회전 · 휠/핀치: 확대 · 노드 드래그: 이동 · 탭: 선택</div>
</div>

<div id="emptyHint">+ 버튼을 눌러 첫 개념을 추가하세요</div>

<div id="viewpointBar"></div>
<div id="legend"></div>

<div id="linkModeBanner">
  연결할 노드를 탭하세요
  <button id="linkModeCancel">취소</button>
</div>

<div id="info-panel">
  <div class="cat" id="ip-cat">CATEGORY</div>
  <input id="ip-label" type="text" placeholder="개념명">
  <textarea id="ip-content" placeholder="요점 내용을 적어두세요"></textarea>
  <div id="ip-images"></div>
  <input type="file" id="ip-image-input" accept="image/*,application/pdf" multiple style="display:none">
  <button id="ip-addimage">+ 파일 추가 (이미지/PDF)</button>
  <div class="stat-row">연결 개념 <b id="ip-links">0</b></div>
  <div class="btn-row">
    <button id="ip-addchild">+ 하위개념</button>
    <button id="ip-linkmode">🔗 연결하기</button>
    <button id="ip-save" class="primary">저장</button>
    <button id="ip-delete" class="danger">삭제</button>
  </div>
</div>

<button id="addBtn">+</button>

<div id="fileViewer">
  <div id="fv-header">
    <span id="fv-title"></span>
    <div id="fv-nav">
      <button id="fv-prev">‹</button>
      <span id="fv-count"></span>
      <button id="fv-next">›</button>
    </div>
    <button id="fv-close">×</button>
  </div>
  <div id="fv-body"></div>
</div>

<div id="modal-overlay">
  <div id="modal">
    <h3>새 개념 추가</h3>
    <div class="parent-badge" id="modal-parent-badge">최상위 개념으로 추가됩니다</div>
    <label>개념명</label>
    <input id="m-label" type="text" placeholder="예: 전단설계">
    <label>카테고리</label>
    <input id="m-category" list="cat-list" placeholder="예: 철근콘크리트">
    <datalist id="cat-list"></datalist>
    <label>요점 내용</label>
    <textarea id="m-content" placeholder="핵심 내용 정리"></textarea>
    <div class="checkbox-row">
      <input id="m-noparent" type="checkbox">
      <label for="m-noparent" style="margin:0">선택 노드 무시하고 최상위로 추가</label>
    </div>
    <div class="btn-row">
      <button id="m-cancel">취소</button>
      <button id="m-save" class="primary">추가</button>
    </div>
  </div>
</div>

<script>
// ---------- 저장/불러오기 ----------
const STORAGE_KEY = 'study_mindmap_v1';
const PALETTE = [0x6fd6ff, 0xff9552, 0x8ef0a0, 0xd9a4ff, 0xffe27a, 0xff7a90, 0x7ad9ff, 0xffb56f];

let categories = {};   // name -> colorHex(number)
let nodes = [];        // {id,label,category,level,content,files[],fixed,x,y,z,vx,vy,vz}
let links = [];        // {source, target} node object refs
let neighborMap = {};
let selectedId = null;
let linkSourceId = null;
let draggingNodeId = null;

// IndexedDB: localStorage보다 용량 한계가 훨씬 커서 이미지/PDF 저장에 안전함.
// 브라우저 안에 내장된 저장소라는 점은 localStorage와 동일 — 서버로 전송되지 않음.
const DB_NAME = 'study_mindmap_db';
const DB_STORE = 'state';
let dbPromise = null;
function openDB(){
  if(dbPromise) return dbPromise;
  dbPromise = new Promise((resolve, reject)=>{
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = ()=>{ req.result.createObjectStore(DB_STORE); };
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = ()=>reject(req.error);
  });
  return dbPromise;
}
function idbGet(key){
  return openDB().then(db=>new Promise((resolve,reject)=>{
    const tx = db.transaction(DB_STORE, 'readonly');
    const req = tx.objectStore(DB_STORE).get(key);
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = ()=>reject(req.error);
  }));
}
function idbSet(key, value){
  return openDB().then(db=>new Promise((resolve,reject)=>{
    const tx = db.transaction(DB_STORE, 'readwrite');
    tx.objectStore(DB_STORE).put(value, key);
    tx.oncomplete = ()=>resolve();
    tx.onerror = ()=>reject(tx.error);
  }));
}

function applyLoadedData(data){
  categories = data.categories || {};
  const byId = {};
  nodes = (data.nodes||[]).map(n=>{
    // images(구버전 필드) -> files 마이그레이션
    const files = n.files || (n.images||[]).map(src=>({type:'image', name:'image', dataUrl:src}));
    const node = {...n, vx:0, vy:0, vz:0, files, fixed: !!n.fixed};
    delete node.images;
    byId[node.id] = node;
    return node;
  });
  links = (data.links||[]).map(([s,t])=>({source:byId[s], target:byId[t]})).filter(l=>l.source && l.target);
}
async function loadData(){
  try{
    let data = await idbGet('main');
    if(!data){
      // localStorage(구버전)에 남아있던 데이터가 있으면 IndexedDB로 1회 이전
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        data = JSON.parse(raw);
        await idbSet('main', data);
        localStorage.removeItem(STORAGE_KEY);
      }
    }
    if(data) applyLoadedData(data);
  }catch(e){ console.warn('load failed', e); }
}
async function saveData(){
  const data = {
    categories,
    nodes: nodes.map(n=>({id:n.id, label:n.label, category:n.category, level:n.level, content:n.content||'', files:n.files||[], fixed:!!n.fixed, x:n.x, y:n.y, z:n.z})),
    links: links.map(l=>[l.source.id, l.target.id]),
  };
  try{
    await idbSet('main', data);
  }catch(e){
    alert('저장에 실패했습니다: ' + e.message);
  }
}
function colorFor(cat){
  if(!categories[cat]){
    const idx = Object.keys(categories).length % PALETTE.length;
    categories[cat] = PALETTE[idx];
  }
  return categories[cat];
}
function hex(c){ return '#'+c.toString(16).padStart(6,'0'); }

const dataReady = loadData();

// ---------- 물리 시뮬레이션 ----------
function simulateStep(){
  const REPULSION = 900, SPRING = 0.02, SPRING_LEN = 32, CENTER = 0.0035, DAMPING = 0.85;
  for(let i=0;i<nodes.length;i++){
    for(let j=i+1;j<nodes.length;j++){
      const a=nodes[i], b=nodes[j];
      let dx=a.x-b.x, dy=a.y-b.y, dz=a.z-b.z;
      let distSq=dx*dx+dy*dy+dz*dz+0.01, dist=Math.sqrt(distSq);
      let force=REPULSION/distSq;
      let fx=dx/dist*force, fy=dy/dist*force, fz=dz/dist*force;
      if(!a.fixed){ a.vx+=fx; a.vy+=fy; a.vz+=fz; }
      if(!b.fixed){ b.vx-=fx; b.vy-=fy; b.vz-=fz; }
    }
  }
  links.forEach(l=>{
    const a=l.source, b=l.target;
    let dx=b.x-a.x, dy=b.y-a.y, dz=b.z-a.z;
    let dist=Math.sqrt(dx*dx+dy*dy+dz*dz)+0.01;
    let force=(dist-SPRING_LEN)*SPRING;
    let fx=dx/dist*force, fy=dy/dist*force, fz=dz/dist*force;
    if(!a.fixed){ a.vx+=fx; a.vy+=fy; a.vz+=fz; }
    if(!b.fixed){ b.vx-=fx; b.vy-=fy; b.vz-=fz; }
  });
  nodes.forEach(n=>{
    if(n.fixed){ n.vx=0; n.vy=0; n.vz=0; return; }
    n.vx-=n.x*CENTER; n.vy-=n.y*CENTER; n.vz-=n.z*CENTER;
    n.vx*=DAMPING; n.vy*=DAMPING; n.vz*=DAMPING;
    n.x+=n.vx; n.y+=n.vy; n.z+=n.vz;
  });
}
function resettle(iterations){
  for(let i=0;i<iterations;i++) simulateStep();
}
function rebuildNeighborMap(){
  neighborMap = {};
  nodes.forEach(n=>neighborMap[n.id]=new Set());
  links.forEach(l=>{ neighborMap[l.source.id].add(l.target.id); neighborMap[l.target.id].add(l.source.id); });
}

// ---------- Three.js 씬 ----------
const wrap = document.getElementById('canvas-wrap');
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a1626, 0.0032);
const camera = new THREE.PerspectiveCamera(55, window.innerWidth/window.innerHeight, 0.1, 5000);
const renderer = new THREE.WebGLRenderer({antialias:true, alpha:false});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x0a1626, 1);
wrap.appendChild(renderer.domElement);
scene.add(new THREE.AmbientLight(0xffffff, 0.9));
const point = new THREE.PointLight(0x6fd6ff, 0.6);
point.position.set(100,100,150);
scene.add(point);

function nodeSize(n){ return n.level===0 ? 4.6 : n.level===1 ? 3.2 : 2.3; }

function makeLabelSprite(label, category, color){
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  const catFont = '600 24px Pretendard, sans-serif';
  const labelFont = '600 40px Pretendard, sans-serif';
  ctx.font = labelFont;
  const labelW = ctx.measureText(label).width;
  ctx.font = catFont;
  const catW = ctx.measureText(category).width;
  const w = Math.max(labelW, catW) + 40;
  const catH = 32, labelH = 52;
  canvas.width = w;
  canvas.height = catH+labelH;
  ctx.fillStyle = 'rgba(10,22,38,0.78)';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.textBaseline='middle'; ctx.textAlign='center';
  ctx.font = catFont;
  ctx.fillStyle = hex(color);
  ctx.fillText(category, canvas.width/2, catH/2+2);
  ctx.font = labelFont;
  ctx.fillStyle = '#dce7f2';
  ctx.fillText(label, canvas.width/2, catH+labelH/2);
  const tex = new THREE.CanvasTexture(canvas);
  const mat = new THREE.SpriteMaterial({map:tex, transparent:true, depthWrite:false});
  const sprite = new THREE.Sprite(mat);
  const scale = 0.09;
  sprite.scale.set(canvas.width*scale, canvas.height*scale, 1);
  return sprite;
}

const nodeGroup = new THREE.Group();
const linkGroup = new THREE.Group();
scene.add(nodeGroup); scene.add(linkGroup);

function disposeGroup(group){
  group.children.slice().forEach(obj=>{
    if(obj.geometry && obj.type==='Mesh') obj.geometry.dispose();
    if(obj.material){
      if(obj.material.map) obj.material.map.dispose();
      obj.material.dispose();
    }
    group.remove(obj);
  });
}

function rebuildScene(){
  disposeGroup(nodeGroup);
  disposeGroup(linkGroup);
  nodes.forEach(n=>{
    const color = colorFor(n.category);
    const size = nodeSize(n);
    const geo = new THREE.SphereGeometry(size, 20, 20);
    const mat = new THREE.MeshStandardMaterial({color, emissive:color, emissiveIntensity:0.55, roughness:0.4, metalness:0.1, transparent:true});
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(n.x, n.y, n.z);
    mesh.userData = { id:n.id };
    nodeGroup.add(mesh);
    n.mesh = mesh;
    const label = makeLabelSprite(n.label, n.category, color);
    label.position.set(n.x, n.y+size+6, n.z);
    nodeGroup.add(label);
    n.label3d = label;
  });
  links.forEach(l=>{
    const geo = new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(l.source.x,l.source.y,l.source.z),
      new THREE.Vector3(l.target.x,l.target.y,l.target.z)
    ]);
    const mat = new THREE.LineBasicMaterial({color:0x2a5a78, transparent:true, opacity:0.55});
    l.line = new THREE.Line(geo, mat);
    linkGroup.add(l.line);
  });
  rebuildNeighborMap();
  document.getElementById('node-count').textContent = nodes.length;
  document.getElementById('link-count').textContent = links.length;
  document.getElementById('emptyHint').style.display = nodes.length===0 ? 'flex' : 'none';
  if(selectedId && !nodes.find(n=>n.id===selectedId)) selectNode(null);
  else if(selectedId) selectNode(selectedId, true);
  refreshCategoryList();
  refreshLegend();
  refreshViewpoints();
  renderer.render(scene, camera); // matrixWorld를 즉시 갱신해 rAF 이전에도 레이캐스팅이 정확하게 동작하도록 함
}
dataReady.then(rebuildScene);

// ---------- 카메라 컨트롤 (임의 지점 주시 가능) ----------
let camTheta=0.6, camPhi=1.15, camDist=260;
let targetTheta=camTheta, targetPhi=camPhi, targetDist=camDist;
let camTarget = {x:0,y:0,z:0};
let targetCamTarget = {x:0,y:0,z:0};
let isDragging=false, dragMoved=false, lastX=0, lastY=0, autoRotate=true;
const LERP = 0.16;

function updateCameraFromSpherical(){
  camera.position.x = camTarget.x + camDist*Math.sin(camPhi)*Math.sin(camTheta);
  camera.position.y = camTarget.y + camDist*Math.cos(camPhi);
  camera.position.z = camTarget.z + camDist*Math.sin(camPhi)*Math.cos(camTheta);
  camera.lookAt(camTarget.x, camTarget.y, camTarget.z);
}
updateCameraFromSpherical();

function focusView(catName){
  const set = catName ? nodes.filter(n=>n.category===catName) : nodes;
  if(set.length===0) return;
  let cx=0,cy=0,cz=0;
  set.forEach(n=>{cx+=n.x;cy+=n.y;cz+=n.z;});
  cx/=set.length; cy/=set.length; cz/=set.length;
  let maxR = 20;
  set.forEach(n=>{ const d=Math.hypot(n.x-cx,n.y-cy,n.z-cz); if(d>maxR) maxR=d; });
  targetCamTarget = {x:cx, y:cy, z:cz};
  targetDist = Math.max(60, Math.min(600, maxR*2.6 + 50));
  autoRotate = false;
}

// ---------- 노드 드래그 / 카메라 궤도 통합 포인터 처리 ----------
const raycaster = new THREE.Raycaster();
const mouseVec = new THREE.Vector2();
const dragPlane = new THREE.Plane();
function screenToNDC(x,y){
  const rect = renderer.domElement.getBoundingClientRect();
  mouseVec.x = ((x-rect.left)/rect.width)*2-1;
  mouseVec.y = -((y-rect.top)/rect.height)*2+1;
  return mouseVec;
}
function raycastNode(x,y){
  raycaster.setFromCamera(screenToNDC(x,y), camera);
  const hits = raycaster.intersectObjects(nodeGroup.children.filter(o=>o.type==='Mesh'));
  return hits.length>0 ? hits[0].object.userData.id : null;
}

function onPointerDown(x,y){
  lastX=x; lastY=y; dragMoved=false;
  const hitId = linkSourceId ? null : raycastNode(x,y);
  if(hitId){
    draggingNodeId = hitId;
    autoRotate = false;
    const n = nodes.find(nn=>nn.id===hitId);
    const camDir = new THREE.Vector3();
    camera.getWorldDirection(camDir);
    dragPlane.setFromNormalAndCoplanarPoint(camDir, new THREE.Vector3(n.x,n.y,n.z));
  } else {
    isDragging = true;
    autoRotate = false;
  }
}
function onPointerMove(x,y){
  const dx=x-lastX, dy=y-lastY;
  if(Math.abs(dx)>2||Math.abs(dy)>2) dragMoved=true;
  if(draggingNodeId){
    raycaster.setFromCamera(screenToNDC(x,y), camera);
    const pt = new THREE.Vector3();
    if(raycaster.ray.intersectPlane(dragPlane, pt)){
      const n = nodes.find(nn=>nn.id===draggingNodeId);
      n.x=pt.x; n.y=pt.y; n.z=pt.z;
      n.mesh.position.set(pt.x,pt.y,pt.z);
      n.label3d.position.set(pt.x, pt.y+nodeSize(n)+6, pt.z);
      links.forEach(l=>{
        if(l.source.id===n.id || l.target.id===n.id){
          const pos = l.line.geometry.attributes.position;
          pos.setXYZ(0, l.source.x, l.source.y, l.source.z);
          pos.setXYZ(1, l.target.x, l.target.y, l.target.z);
          pos.needsUpdate = true;
        }
      });
    }
    lastX=x; lastY=y;
    return;
  }
  if(isDragging){
    targetTheta -= dx*0.012;
    targetPhi -= dy*0.012;
    targetPhi = Math.max(0.25, Math.min(Math.PI-0.25, targetPhi));
  }
  lastX=x; lastY=y;
}
function onPointerUp(){
  if(draggingNodeId){
    const id = draggingNodeId;
    draggingNodeId = null;
    if(dragMoved){
      const n = nodes.find(nn=>nn.id===id);
      n.fixed = true;
      resettle(40);
      rebuildScene();
      saveData();
    }
  }
  isDragging = false;
}
renderer.domElement.addEventListener('mousedown', e=>onPointerDown(e.clientX,e.clientY));
window.addEventListener('mousemove', e=>onPointerMove(e.clientX,e.clientY));
window.addEventListener('mouseup', onPointerUp);

let lastPinch=null;
function pinchDist(t){ return Math.hypot(t[0].clientX-t[1].clientX, t[0].clientY-t[1].clientY); }
renderer.domElement.addEventListener('touchstart', e=>{
  if(e.touches.length===1) onPointerDown(e.touches[0].clientX, e.touches[0].clientY);
  lastPinch = e.touches.length===2 ? pinchDist(e.touches) : null;
}, {passive:true});
renderer.domElement.addEventListener('touchmove', e=>{
  if(e.touches.length===1) onPointerMove(e.touches[0].clientX, e.touches[0].clientY);
  else if(e.touches.length===2){
    const d = pinchDist(e.touches);
    if(lastPinch){ targetDist -= (d-lastPinch)*1.0; targetDist = Math.max(60,Math.min(600,targetDist)); }
    lastPinch = d;
  }
}, {passive:true});
renderer.domElement.addEventListener('touchend', ()=>{ onPointerUp(); lastPinch=null; });
renderer.domElement.addEventListener('wheel', e=>{
  e.preventDefault();
  targetDist += e.deltaY*0.16;
  targetDist = Math.max(60, Math.min(600, targetDist));
}, {passive:false});

// 브라우저 기본 드래그앤드롭(깨진 이미지로 뜨는 문제)을 막고, 노드 위에 드롭하면 그 노드에 파일로 첨부
window.addEventListener('dragover', e=>e.preventDefault());
window.addEventListener('drop', e=>e.preventDefault());
renderer.domElement.addEventListener('dragover', e=>e.preventDefault());
renderer.domElement.addEventListener('drop', async e=>{
  e.preventDefault();
  const hitId = raycastNode(e.clientX, e.clientY);
  if(!hitId || !e.dataTransfer.files.length) return;
  const n = nodes.find(x=>x.id===hitId);
  await attachFiles(n, Array.from(e.dataTransfer.files));
  selectNode(hitId);
});

// ---------- 클릭: 선택 / 연결 대상 지정 ----------
function handlePick(clientX, clientY){
  if(dragMoved) return;
  const hitId = raycastNode(clientX, clientY);
  if(linkSourceId){
    if(hitId && hitId!==linkSourceId) createLink(linkSourceId, hitId);
    exitLinkMode();
    return;
  }
  selectNode(hitId);
}
renderer.domElement.addEventListener('click', e=>handlePick(e.clientX, e.clientY));

function createLink(aId,bId){
  const exists = links.some(l=>(l.source.id===aId&&l.target.id===bId)||(l.source.id===bId&&l.target.id===aId));
  if(exists) return;
  const a = nodes.find(n=>n.id===aId), b = nodes.find(n=>n.id===bId);
  if(!a||!b) return;
  links.push({source:a, target:b});
  resettle(60);
  saveData();
  rebuildScene();
  selectNode(aId);
}
function startLinkMode(){
  if(!selectedId) return;
  linkSourceId = selectedId;
  document.getElementById('linkModeBanner').style.display = 'flex';
}
function exitLinkMode(){
  linkSourceId = null;
  document.getElementById('linkModeBanner').style.display = 'none';
}
document.getElementById('linkModeCancel').addEventListener('click', exitLinkMode);

// ---------- 정보 패널 ----------
const infoPanel = document.getElementById('info-panel');
const ipCat = document.getElementById('ip-cat');
const ipLabel = document.getElementById('ip-label');
const ipContent = document.getElementById('ip-content');
const ipLinks = document.getElementById('ip-links');
const ipImages = document.getElementById('ip-images');

function renderImages(n){
  ipImages.innerHTML = '';
  (n.files||[]).forEach((f, idx)=>{
    const thumb = document.createElement('div');
    if(f.type==='pdf'){
      thumb.className = 'thumb pdf-thumb';
      thumb.textContent = 'PDF';
    } else {
      thumb.className = 'thumb';
      const img = document.createElement('img');
      img.src = f.dataUrl;
      thumb.appendChild(img);
    }
    thumb.addEventListener('click', ()=>openViewer(n.files, idx));
    const del = document.createElement('div');
    del.className = 'del';
    del.textContent = '×';
    del.addEventListener('click', ev=>{
      ev.stopPropagation();
      n.files.splice(idx,1);
      renderImages(n);
      saveData();
    });
    thumb.appendChild(del);
    ipImages.appendChild(thumb);
  });
}

// ---------- 파일 뷰어 (이미지/PDF, 이동 가능한 창) ----------
let viewerFiles = [];
let viewerIndex = 0;
const fileViewer = document.getElementById('fileViewer');
const fvBody = document.getElementById('fv-body');
const fvTitle = document.getElementById('fv-title');
const fvCount = document.getElementById('fv-count');

function openViewer(files, idx){
  if(!files || files.length===0) return;
  viewerFiles = files;
  viewerIndex = idx;
  if(fileViewer.style.display !== 'flex'){
    const w = Math.min(window.innerWidth*0.85, 900);
    const h = window.innerHeight*0.82;
    fileViewer.style.width = w+'px';
    fileViewer.style.height = h+'px';
    fileViewer.style.left = ((window.innerWidth-w)/2)+'px';
    fileViewer.style.top = ((window.innerHeight-h)/2)+'px';
  }
  fileViewer.style.display = 'flex';
  renderViewerContent();
}
function renderViewerContent(){
  const f = viewerFiles[viewerIndex];
  fvBody.innerHTML = '';
  if(f.type==='pdf'){
    const embed = document.createElement('embed');
    embed.src = f.dataUrl;
    embed.type = 'application/pdf';
    fvBody.appendChild(embed);
  } else {
    const img = document.createElement('img');
    img.src = f.dataUrl;
    fvBody.appendChild(img);
  }
  fvTitle.textContent = f.name || (f.type==='pdf' ? 'PDF' : '이미지');
  fvCount.textContent = viewerFiles.length>1 ? (viewerIndex+1)+' / '+viewerFiles.length : '';
  document.getElementById('fv-nav').style.display = viewerFiles.length>1 ? 'flex' : 'none';
}
function closeViewer(){ fileViewer.style.display = 'none'; }
document.getElementById('fv-close').addEventListener('click', closeViewer);
document.getElementById('fv-prev').addEventListener('click', ()=>{
  viewerIndex = (viewerIndex-1+viewerFiles.length)%viewerFiles.length;
  renderViewerContent();
});
document.getElementById('fv-next').addEventListener('click', ()=>{
  viewerIndex = (viewerIndex+1)%viewerFiles.length;
  renderViewerContent();
});

// 뷰어 창 드래그 이동 (헤더를 잡고 이동)
(function(){
  const header = document.getElementById('fv-header');
  let dragging=false, offX=0, offY=0;
  function down(x,y){
    dragging = true;
    const rect = fileViewer.getBoundingClientRect();
    offX = x-rect.left; offY = y-rect.top;
  }
  function move(x,y){
    if(!dragging) return;
    let left = x-offX, top = y-offY;
    left = Math.max(0, Math.min(window.innerWidth-60, left));
    top = Math.max(0, Math.min(window.innerHeight-40, top));
    fileViewer.style.left = left+'px';
    fileViewer.style.top = top+'px';
  }
  function up(){ dragging = false; }
  header.addEventListener('mousedown', e=>down(e.clientX,e.clientY));
  window.addEventListener('mousemove', e=>move(e.clientX,e.clientY));
  window.addEventListener('mouseup', up);
  header.addEventListener('touchstart', e=>{ const t=e.touches[0]; down(t.clientX,t.clientY); }, {passive:true});
  header.addEventListener('touchmove', e=>{ const t=e.touches[0]; move(t.clientX,t.clientY); }, {passive:true});
  header.addEventListener('touchend', up);
})();

function selectNode(id, silent){
  selectedId = id;
  const neighbors = id ? neighborMap[id] : null;
  nodes.forEach(n=>{
    const dim = id && n.id!==id && !neighbors.has(n.id);
    const isSel = n.id===id;
    n.mesh.material.emissiveIntensity = isSel ? 1.1 : dim ? 0.12 : 0.55;
    n.mesh.material.opacity = dim ? 0.25 : 1;
    n.mesh.scale.setScalar(isSel ? 1.6 : 1);
    n.label3d.material.opacity = dim ? 0.15 : 1;
  });
  links.forEach(l=>{
    const active = id && (l.source.id===id || l.target.id===id);
    l.line.material.opacity = id ? (active?0.9:0.05) : 0.55;
    l.line.material.color.set(active ? 0xff9552 : 0x2a5a78);
  });
  document.getElementById('viewpointBar').style.display = (!id && nodes.length) ? 'flex' : 'none';
  if(id){
    const n = nodes.find(x=>x.id===id);
    if(!n){ infoPanel.classList.remove('show'); return; }
    const c = colorFor(n.category);
    ipCat.textContent = n.category;
    ipCat.style.color = hex(c);
    ipCat.style.background = hex(c)+'26';
    ipLabel.value = n.label;
    ipContent.value = n.content || '';
    ipLinks.textContent = neighbors.size;
    renderImages(n);
    infoPanel.classList.add('show');
    if(!silent && n.files && n.files.length) openViewer(n.files, 0);
    else if(!silent) closeViewer();
  } else {
    infoPanel.classList.remove('show');
  }
}

document.getElementById('ip-save').addEventListener('click', ()=>{
  const n = nodes.find(x=>x.id===selectedId);
  if(!n) return;
  const labelChanged = n.label !== ipLabel.value;
  n.label = ipLabel.value.trim() || n.label;
  n.content = ipContent.value;
  saveData();
  if(labelChanged) rebuildScene(); else selectNode(selectedId, true);
});
document.getElementById('ip-delete').addEventListener('click', ()=>{
  if(!selectedId) return;
  if(!confirm('이 개념을 삭제할까요? 연결된 관계선도 함께 삭제됩니다.')) return;
  nodes = nodes.filter(n=>n.id!==selectedId);
  links = links.filter(l=>l.source.id!==selectedId && l.target.id!==selectedId);
  selectedId = null;
  resettle(60);
  saveData();
  rebuildScene();
  infoPanel.classList.remove('show');
});
document.getElementById('ip-addchild').addEventListener('click', ()=>openModal(selectedId));
document.getElementById('ip-linkmode').addEventListener('click', startLinkMode);

document.getElementById('ip-addimage').addEventListener('click', ()=>document.getElementById('ip-image-input').click());
document.getElementById('ip-image-input').addEventListener('change', async e=>{
  const n = nodes.find(x=>x.id===selectedId);
  if(!n) return;
  await attachFiles(n, Array.from(e.target.files));
  e.target.value = '';
});
async function attachFiles(n, fileList){
  n.files = n.files || [];
  for(const file of fileList){
    if(!file.type.startsWith('image/') && file.type!=='application/pdf') continue;
    const entry = await readFile(file);
    n.files.push(entry);
  }
  renderImages(n);
  saveData();
}
function readFile(file){
  if(file.type==='application/pdf'){
    return new Promise(resolve=>{
      const reader = new FileReader();
      reader.onload = ()=>resolve({type:'pdf', name:file.name, dataUrl:reader.result});
      reader.readAsDataURL(file);
    });
  }
  return new Promise(resolve=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        const maxW = 800;
        const scale = Math.min(1, maxW/img.width);
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width*scale);
        canvas.height = Math.round(img.height*scale);
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img,0,0,canvas.width,canvas.height);
        resolve({type:'image', name:file.name, dataUrl:canvas.toDataURL('image/jpeg', 0.72)});
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

// ---------- 카테고리 datalist / 범례 / 뷰포인트 칩 ----------
function refreshCategoryList(){
  const dl = document.getElementById('cat-list');
  dl.innerHTML = Object.keys(categories).map(c=>`<option value="${c}">`).join('');
}
function refreshLegend(){
  const legendEl = document.getElementById('legend');
  legendEl.innerHTML = '';
  Object.keys(categories).forEach(cat=>{
    const item = document.createElement('div');
    item.className = 'item';
    item.innerHTML = `<span class="dot" style="background:${hex(categories[cat])}"></span>${cat}`;
    legendEl.appendChild(item);
  });
  legendEl.style.display = Object.keys(categories).length ? 'flex' : 'none';
}
function refreshViewpoints(){
  const bar = document.getElementById('viewpointBar');
  bar.innerHTML = '';
  const allChip = document.createElement('button');
  allChip.className = 'vp-chip all';
  allChip.textContent = '전체보기';
  allChip.addEventListener('click', ()=>focusView(null));
  bar.appendChild(allChip);
  Object.keys(categories).forEach(cat=>{
    const chip = document.createElement('button');
    chip.className = 'vp-chip';
    chip.style.borderColor = hex(categories[cat]);
    chip.textContent = cat;
    chip.addEventListener('click', ()=>focusView(cat));
    bar.appendChild(chip);
  });
  bar.style.display = (!selectedId && nodes.length) ? 'flex' : 'none';
}

// ---------- 추가 모달 ----------
const modalOverlay = document.getElementById('modal-overlay');
const mLabel = document.getElementById('m-label');
const mCategory = document.getElementById('m-category');
const mContent = document.getElementById('m-content');
const mNoParent = document.getElementById('m-noparent');
let modalParentId = null;

function openModal(parentId){
  modalParentId = parentId || null;
  mLabel.value=''; mCategory.value=''; mContent.value=''; mNoParent.checked=false;
  const parent = modalParentId ? nodes.find(n=>n.id===modalParentId) : null;
  const badge = document.getElementById('modal-parent-badge');
  if(parent){
    badge.textContent = '↳ 상위 개념: ' + parent.label;
    badge.style.borderLeftColor = hex(colorFor(parent.category));
    badge.classList.add('has-parent');
    mCategory.value = parent.category;
  } else {
    badge.textContent = '최상위 개념으로 추가됩니다';
    badge.style.borderLeftColor = '';
    badge.classList.remove('has-parent');
  }
  modalOverlay.style.display = 'flex';
  setTimeout(()=>mLabel.focus(), 50);
}
document.getElementById('addBtn').addEventListener('click', ()=>openModal(selectedId));
document.getElementById('m-cancel').addEventListener('click', ()=>modalOverlay.style.display='none');
modalOverlay.addEventListener('click', e=>{ if(e.target===modalOverlay) modalOverlay.style.display='none'; });

document.getElementById('m-save').addEventListener('click', ()=>{
  const label = mLabel.value.trim();
  if(!label){ mLabel.focus(); return; }
  const category = mCategory.value.trim() || '미분류';
  const useParent = modalParentId && !mNoParent.checked;
  const parent = useParent ? nodes.find(n=>n.id===modalParentId) : null;

  const id = 'n_' + Date.now() + '_' + Math.floor(Math.random()*1000);
  const baseX = parent ? parent.x : 0, baseY = parent ? parent.y : 0, baseZ = parent ? parent.z : 0;
  const node = {
    id, label, category,
    level: parent ? Math.min(parent.level+1, 2) : 0,
    content: mContent.value,
    files: [],
    fixed: false,
    x: baseX + (Math.random()-0.5)*20,
    y: baseY + (Math.random()-0.5)*20,
    z: baseZ + (Math.random()-0.5)*20,
    vx:0, vy:0, vz:0,
  };
  colorFor(category);
  nodes.push(node);
  if(parent) links.push({source:parent, target:node});

  resettle(100);
  saveData();
  modalOverlay.style.display = 'none';
  rebuildScene();
  selectNode(id);
});

// ---------- 리사이즈 ----------
window.addEventListener('resize', ()=>{
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ---------- 애니메이션 루프 ----------
function animate(){
  requestAnimationFrame(animate);
  if(autoRotate && !isDragging && !draggingNodeId) targetTheta += 0.0016;
  camTheta += (targetTheta-camTheta)*LERP;
  camPhi += (targetPhi-camPhi)*LERP;
  camDist += (targetDist-camDist)*LERP;
  camTarget.x += (targetCamTarget.x-camTarget.x)*LERP;
  camTarget.y += (targetCamTarget.y-camTarget.y)*LERP;
  camTarget.z += (targetCamTarget.z-camTarget.z)*LERP;
  updateCameraFromSpherical();
  renderer.render(scene, camera);
}
animate();

// ---------- PWA: 서비스워커 등록 (file://에서는 동작 안 함, http(s) 또는 localhost에서만) ----------
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(err=>console.warn('service worker 등록 실패', err));
  });
}
